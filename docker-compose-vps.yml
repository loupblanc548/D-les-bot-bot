services:
  bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const start=Date.now();http.get('http://localhost:3000/health',r=>{if(r.statusCode!==200){process.exit(1);}let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);if(j.status!=='ok'){process.exit(1);}process.exit(0);}catch{process.exit(1);}});}).on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot
      POSTGRES_DB: discord_bot
    command: postgres -c shared_buffers=256MB -c max_connections=40 -c work_mem=8MB
    mem_limit: 512m
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 192m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
