---
- name: Provision Discord Bot VPS
  hosts: all
  become: yes
  vars:
    node_version: "20"
    bot_dir: "/opt/bot"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install base packages
      apt:
        name:
          - curl
          - git
          - ufw
          - fail2ban
          - htop
          - jq
          - build-essential
          - python3
          - ca-certificates
          - gnupg
        state: present

    - name: Add Node.js GPG key
      apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        state: present

    - name: Add Node.js repository
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        update_cache: yes

    - name: Install Node.js
      apt:
        name: "nodejs"
        state: present

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Create bot directory
      file:
        path: "{{ bot_dir }}"
        state: directory
        owner: root
        mode: '0755'

    - name: Install Chromium dependencies
      apt:
        name:
          - libnss3
          - libatk-bridge2.0-0
          - libx11-xcb1
          - libxcomposite1
          - libxdamage1
          - libxrandr2
          - libgbm1
          - libasound2
          - libgtk-3-0
          - libpangocairo-1.0-0
        state: present

    - name: Configure UFW firewall
      ufw:
        state: enabled
        policy: deny
        rule: allow
        port: 22
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: 443
        proto: tcp

    - name: Enable fail2ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    - name: Set up swap (8GB overflow for 8GB RAM VPS)
      shell: |
        bash "{{ bot_dir }}/scripts/setup-swap.sh" || {
          if [ ! -f /swapfile ]; then
            fallocate -l 8G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=8192
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          sysctl -w vm.swappiness=25
        }
      args:
        creates: /swapfile
