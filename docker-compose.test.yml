# Docker Compose for integration testing
# Usage: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from bot-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bot_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data

  bot-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://test:test@postgres-test:5432/bot_test?schema=public"
      REDIS_URL: "redis://redis-test:6379"
      NODE_ENV: "test"
    command: >
      sh -c "npx prisma migrate deploy && npx vitest run --reporter=verbose"
