name: "📦 Nightly DB Backup"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "⚠️ DATABASE_URL secret not set — skipping backup"
            exit 0
          fi
          echo "✅ DATABASE_URL is set"

      - name: Make backup script executable
        run: chmod +x scripts/db-backup.sh

      - name: Run backup
        run: ./scripts/db-backup.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: /tmp/backups/
          retention-days: 7
          if-no-files-found: warn
